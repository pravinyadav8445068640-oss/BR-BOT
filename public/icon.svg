<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Subtle Grid Pattern in background -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
  
  <!-- Glow effect -->
  <circle cx="256" cy="240" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Bot / Options Shield & Wings Shape -->
  <path d="M120 180 L256 100 L392 180 L392 310 Q392 400 256 430 Q120 400 120 310 Z" 
        stroke="url(#emeraldGrad)" stroke-width="8" fill="#0f172a" fill-opacity="0.85" filter="url(#glow)"/>

  <!-- Candlestick chart + Delta Curves inside -->
  <!-- Candle 1 -->
  <line x1="184" y1="210" x2="184" y2="310" stroke="#10b981" stroke-width="4"/>
  <rect x="174" y="235" width="20" height="50" rx="4" fill="#10b981"/>

  <!-- Candle 2 (Center Big Green) -->
  <line x1="256" y1="170" x2="256" y2="330" stroke="#38bdf8" stroke-width="4"/>
  <rect x="244" y="195" width="24" height="95" rx="5" fill="#38bdf8"/>

  <!-- Candle 3 -->
  <line x1="328" y1="200" x2="328" y2="320" stroke="#10b981" stroke-width="4"/>
  <rect x="318" y="225" width="20" height="60" rx="4" fill="#10b981"/>

  <!-- Options Delta/Gamma Ribbon Overlay -->
  <path d="M140 330 C 180 370, 220 280, 256 220 C 290 170, 340 230, 375 250" 
        stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- BR Monogram at Top -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle" letter-spacing="4">BR BOT</text>
  <text x="256" y="402" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#10b981" text-anchor="middle" letter-spacing="2">AI CRYPTO OPTIONS</text>
</svg>
